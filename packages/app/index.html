<!doctype html>
<html lang="en" style="background-color: var(--v2-background-bg-deep, #fafafa)">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <!-- 【保留的定制 · 同步上游时不要丢】浏览器页签的品牌标识（2026-11-03）。
         图标按 DESIGN §5.1 的内置品牌标（金色六边形）单独生成，放在 `public/`，
         不覆盖上游的 `favicon-v3.*`。守卫用例：`src/branding.test.ts`。 -->
    <title>OpenHive</title>
    <link rel="icon" type="image/png" href="/favicon-openhive-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon-openhive.svg" />
    <link rel="shortcut icon" href="/favicon-openhive.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:image" content="/social-share.png" />
    <meta property="twitter:image" content="/social-share.png" />
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden bg-v2-background-bg-deep">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="flex flex-col h-dvh bg-v2-background-bg-deep p-px"></div>
    <script src="/src/entry.tsx" type="module"></script>
  </body>
</html>
